# Weekly dependency update PRs (they target develop and must pass CI like any change).
version: 2
# The Paxofi Core Framework is a private GitHub repository. Dependabot reads it
# with a read-only token stored as the Dependabot secret PCF_GITHUB_TOKEN.
registries:
  paxofi-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.PCF_GITHUB_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime is Node 22 on cPanel: keep the type definitions on the same major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Majors that eslint-config-next / Next.js do not support yet; revisit when they do.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: composer
    directory: /backend
    target-branch: develop
    registries: [paxofi-github]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: {interval: monthly}
