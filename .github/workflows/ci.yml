name: Corporate Website CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    env:
      COMPOSER_AUTH: ${{ secrets.PCF_COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - name: Verify PCF Composer credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSER_AUTH:-}" ]; then
            echo "PCF_COMPOSER_AUTH repository secret is required to install the private PCF dependency."
            exit 1
          fi
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test

  repository:
    name: Repository controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate boundaries and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f frontend/package.json
          test -f backend/composer.json
          test -f database/001_initial_schema.sql
          test -f database/002_enquiry_metadata.sql
          test -f database/003_enquiry_rate_limit_index.sql
          if grep -RInE '(^|/)(\.env|.*\.pem|.*\.key)$' . --exclude-dir=.git --exclude='*.md' --exclude='.gitignore'; then
            echo 'Potential secret-bearing file detected.'
            exit 1
          fi
