name: Corporate Website CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on known vulnerabilities)
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility (WCAG 2.1 AA) and security-header tests
        run: npm run test:e2e

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    env:
      COMPOSER_AUTH: ${{ secrets.PCF_COMPOSER_AUTH }}
      # Integration tests create a throwaway database and apply every migration.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-root-password
      INTEGRATION_REQUIRED: '1'
    services:
      mariadb:
        image: mariadb:11.4  # matches production (paxoalhu_corporate dump: 11.4.13-MariaDB)
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verify PCF Composer credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSER_AUTH:-}" ]; then
            echo "PCF_COMPOSER_AUTH is unavailable to this workflow run. Push-triggered runs must have repository-level or permitted environment-level secret access."
            exit 1
          fi
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency audit (fails on known vulnerabilities)
        run: composer audit --no-interaction
      - run: composer test

  repository:
    name: Repository controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Repository contract tests
        run: node --test 'tests/*.test.js'
      - name: Lint deployment scripts
        run: shellcheck -S warning ops/*.sh
      - name: Validate boundaries and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -f backend/composer.json
          test -f database/001_initial_schema.sql
          test -f database/002_enquiry_metadata.sql
          test -f database/003_enquiry_rate_limit_index.sql
          test -f database/004_seed_published_catalog.sql
          test -f database/005_audit_event_action_index.sql
          test -f database/006_innodb_utf8mb4_and_foreign_keys.sql
          test -f backend/composer.lock
          if grep -RInE '(^|/)(\.env|.*\.pem|.*\.key)$' . --exclude-dir=.git --exclude='*.md' --exclude='.gitignore'; then
            echo 'Potential secret-bearing file detected.'
            exit 1
          fi

  package:
    name: cPanel upload packages
    # Every validated commit on main gets ready-to-upload ZIPs (Actions → run → Artifacts).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, repository]
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.PCF_COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build packages
        run: OUT_DIR="$GITHUB_WORKSPACE/dist/release" ops/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-release-${{ github.sha }}
          path: dist/release/
          retention-days: 90
