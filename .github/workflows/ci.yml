name: Corporate Website CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (runtime must be clean; dev-only exceptions need a reason and expiry)
        run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility (WCAG 2.1 AA) and security-header tests
        run: npm run test:e2e

  cross-browser:
    name: Cross-browser end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end, responsive and accessibility tests in ${{ matrix.browser }}
        run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}

  security-scan:
    name: Security scan (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start the production build
        run: |
          API_BASE_URL=https://api.paxofi.com/api/v1 nohup npx next start -p 3000 -H 127.0.0.1 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1
      - name: ZAP baseline (passive) scan; any unlisted warning fails
        working-directory: .
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000 -c rules.tsv -r zap-report.html -J zap-report.json
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/zap-report.*
          if-no-files-found: ignore

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    env:
      COMPOSER_AUTH: ${{ secrets.PCF_COMPOSER_AUTH }}
      # Integration tests create a throwaway database and apply every migration.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-root-password
      INTEGRATION_REQUIRED: '1'
    services:
      mariadb:
        image: mariadb:11.4  # matches production (paxoalhu_corporate dump: 11.4.13-MariaDB)
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, gd, zip
          coverage: none
      - name: Verify PCF Composer credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSER_AUTH:-}" ]; then
            echo "PCF_COMPOSER_AUTH is unavailable to this workflow run. Push-triggered runs must have repository-level or permitted environment-level secret access."
            exit 1
          fi
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency audit (fails on known vulnerabilities)
        run: composer audit --no-interaction
      - run: composer test

  repository:
    name: Repository controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Repository contract tests
        run: node --test 'tests/*.test.js'
      - name: Lint deployment scripts
        run: shellcheck -S warning ops/*.sh
      - name: Validate boundaries and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -f backend/composer.json
          test -f database/001_initial_schema.sql
          test -f database/002_enquiry_metadata.sql
          test -f database/003_enquiry_rate_limit_index.sql
          test -f database/004_seed_published_catalog.sql
          test -f database/005_audit_event_action_index.sql
          test -f database/006_innodb_utf8mb4_and_foreign_keys.sql
          test -f database/007_staff_sign_in_and_roles.sql
          test -f database/008_staff_two_factor.sql
          test -f database/009_editable_catalog.sql
          test -f database/010_media_library.sql
          test -f database/011_cookieless_analytics.sql
          test -f backend/composer.lock
          if grep -RInE '(^|/)(\.env|.*\.pem|.*\.key)$' . --exclude-dir=.git --exclude='*.md' --exclude='.gitignore'; then
            echo 'Potential secret-bearing file detected.'
            exit 1
          fi

  package:
    name: cPanel upload packages
    # Every validated commit on main gets ready-to-upload ZIPs (Actions → run → Artifacts).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, cross-browser, security-scan, backend, repository]
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.PCF_COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build packages
        run: OUT_DIR="$GITHUB_WORKSPACE/dist/release" ops/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cpanel-release-${{ github.sha }}
          path: dist/release/
          retention-days: 90
