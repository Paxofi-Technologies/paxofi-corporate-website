# Local development stack. Before the first `docker compose up`, install the
# backend dependencies once (PCF is private; needs Composer GitHub auth):
#   (cd backend && composer install)
services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start"
    volumes: ["../frontend:/app"]
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  backend:
    image: php:8.4-cli
    working_dir: /app
    # The stock image lacks pdo_mysql. Migrations run through the same runner
    # as production (bin/migrate.php), then the API is served.
    command: sh -c "docker-php-ext-install pdo_mysql >/dev/null && php bin/migrate.php && php -S 0.0.0.0:8080 -t public public/index.php"
    volumes: ["../backend:/app", "../database:/database:ro"]
    ports: ["8080:8080"]
    environment:
      APP_ENV: development
      DB_HOST: database
      DB_DATABASE: paxofi_corporate_website
      DB_USERNAME: paxofi
      DB_PASSWORD: local-dev-only
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: paxofi_corporate_website
      MARIADB_USER: paxofi
      MARIADB_PASSWORD: local-dev-only
      MARIADB_ROOT_PASSWORD: local-dev-only-root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
