services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start"
    volumes: ["../frontend:/app"]
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  backend:
    image: php:8.4-cli
    working_dir: /app
    # The stock image lacks pdo_mysql; install it, then serve the API.
    command: sh -c "docker-php-ext-install pdo_mysql >/dev/null && php -S 0.0.0.0:8080 -t public public/index.php"
    volumes: ["../backend:/app"]
    ports: ["8080:8080"]
    environment:
      APP_ENV: development
      DB_HOST: database
      DB_DATABASE: paxofi_corporate_website
      DB_USERNAME: paxofi
      DB_PASSWORD: local-dev-only
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on: [database]
  database:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: paxofi_corporate_website
      MARIADB_USER: paxofi
      MARIADB_PASSWORD: local-dev-only
      MARIADB_ROOT_PASSWORD: local-dev-only-root
    # Migrations in ../database are applied in filename order on first start.
    volumes: ["../database:/docker-entrypoint-initdb.d:ro"]
    ports: ["3306:3306"]
